name: Check gz-mcp-lsp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: macos-15
            architecture: arm64
          - os: windows-2025
            architecture: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.14.10'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - name: Verify required interpreter and architecture
        run: uv run --locked python -c "import platform, sys; assert platform.python_version() == '3.14.10'; assert platform.machine() == '${{ matrix.architecture }}'; print(sys.executable, platform.platform())"
      - name: Run four hooks with test and platform-skip evidence
        run: uv run --locked pre-commit run --all-files --verbose
      - run: uv build --no-sources
      - run: uv run --locked python tools/verify_distribution.py
