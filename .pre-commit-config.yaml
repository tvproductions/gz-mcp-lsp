repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: unittest
        name: unittest
        entry: uv run --locked python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        always_run: true
