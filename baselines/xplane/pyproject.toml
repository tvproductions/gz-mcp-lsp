[project]
name = "skills-first-xplane-baseline"
version = "0.1.0"
description = "Standalone tooling reference for host-bound XPPython3 adopters"
requires-python = ">=3.12,<3.13"
dependencies = []

# A dependency-only reference environment, not an application or distribution.
# Adopter runtime packages still require src/ layout and a declared build backend.
[tool.uv]
package = false
required-version = "==0.13.5"
python-preference = "only-managed"
# uv 0.13.5 predates the latest 3.12 patch's download metadata.
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/68677f5439c027db17b4db7821882a9881d376f6/crates/uv-python-managed/download-metadata.json"

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "ty==0.0.92",
    "pre-commit==4.7.0",
    "uv_build==0.13.5",
]
hygiene = [
    "bandit==1.9.4",
    # Defect reproducer only; not qualified cognitive acceptance authority.
    "complexipy==8.2.0",
    "cosmic-ray==8.7.0",
    "coverage==7.17.0",
    "deptry==0.25.1",
    "import-linter==2.15",
    "interrogate==1.7.0",
    "lizard==1.24.3",
    "pip-audit==2.10.1",
    "vulture==2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ty.environment]
python-version = "3.12"
