[project]
name = "gz-mcp-lsp"
version = "0.0.0"
description = "LSP-to-MCP semantic navigation and guarded source changes (design stage)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"
python-preference = "only-managed"
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/68677f5439c027db17b4db7821882a9881d376f6/crates/uv-python-managed/download-metadata.json"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "docs/**", "AGENTS.md", "AGENTS.skills-first.md",
                  "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", ".python-version",
                  "uv.lock", ".pre-commit-config.yaml", ".github/**",
                  ".skills-first/**", ".codex/config.toml", ".agents/**",
                  ".claude-plugin/marketplace.json", "bundle.json"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

# Routine tools and explicit on-demand analysis stay out of runtime dependencies.
[dependency-groups]
dev = [
    "ruff==0.17.3",
    "ty==0.0.93",
    "pre-commit==4.7.0",
]
hygiene = [
    "bandit==1.9.4",
    "cohesion==1.2.0",
    # Defect reproducer only; not qualified as cognitive acceptance authority.
    "complexipy==8.3.0",
    "cosmic-ray==8.7.0",
    "coverage==7.17.0",
    "deptry==0.25.1",
    "import-linter==2.15",
    "interrogate==1.7.0",
    "lizard==1.24.3",
    "pip-audit==2.10.1",
    "vulture==2.16",
]

# C901 is deliberately absent from the routine lint selection above.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.complexipy]
paths = ["src", "tests", "tools/engineering"]
max-complexity-allowed = 15
check-script = true
no-ignore = true
snapshot-ignore = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.importlinter]
root_packages = ["gz_mcp_lsp"]
# Dependency-direction contracts will be added with reviewed runtime modules.

[tool.deptry]
known_first_party = ["gz_mcp_lsp"]
extend_exclude = ["tools/.*"]
