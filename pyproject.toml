[project]
name = "gz-mcp-lsp"
version = "0.1.0"
description = "LSP-to-MCP semantic navigation and guarded source changes (in development)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
gz-mcp-lsp = "gz_mcp_lsp.cli:main"

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6"
python-preference = "only-managed"
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/3d97a6aad5ad989c1b4fc89406d54f0dce370b72/crates/uv-python-managed/download-metadata.json"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "docs/**", "AGENTS.md", "AGENTS.skills-first.md",
                  "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", ".python-version",
                  "uv.lock", ".pre-commit-config.yaml", ".github/**",
                  ".skills-first/**", ".codex/config.toml", ".agents/**",
                  ".claude-plugin/marketplace.json", "bundle.json"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

# Routine tools and explicit on-demand analysis stay out of runtime dependencies.
[dependency-groups]
dev = [
    "ruff==0.17.5",
    "ty==0.0.103",
    "pre-commit==4.7.0",
]
hygiene = [
    "bandit==1.9.4",
    "cohesion==1.2.0",
    # Comparison candidate only; not qualified as cognitive acceptance authority.
    "complexipy==9.0.0",
    "cosmic-ray==8.9.0",
    "coverage==7.17.3",
    "deptry==0.25.1",
    "import-linter==2.16",
    "interrogate==1.7.0",
    "lizard==1.26.0",
    "pip-audit==2.10.1",
    "vulture==2.16",
]

# C901 is deliberately absent from the routine lint selection above.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.complexipy]
paths = ["src", "tests", "tools/engineering"]
max-complexity-allowed = 15
check-script = true
no-ignore = true
snapshot-ignore = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.importlinter]
root_packages = ["gz_mcp_lsp"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "MCP SDK stays at the MCP boundary"
type = "forbidden"
source_modules = [
    "gz_mcp_lsp.config", "gz_mcp_lsp.models", "gz_mcp_lsp.results",
    "gz_mcp_lsp.workspace", "gz_mcp_lsp.source_text", "gz_mcp_lsp.edit_plan",
    "gz_mcp_lsp.documents", "gz_mcp_lsp.navigation", "gz_mcp_lsp.diagnostics",
    "gz_mcp_lsp.mutations", "gz_mcp_lsp.filesystem", "gz_mcp_lsp._posix_files",
    "gz_mcp_lsp.session", "gz_mcp_lsp.lsp_transport",
]
forbidden_modules = ["mcp"]

[[tool.importlinter.contracts]]
name = "Semantic operations use session and document seams"
type = "forbidden"
source_modules = ["gz_mcp_lsp.navigation", "gz_mcp_lsp.diagnostics"]
forbidden_modules = [
    "gz_mcp_lsp.lsp_transport", "gz_mcp_lsp.filesystem",
    "gz_mcp_lsp._posix_files", "gz_mcp_lsp.mcp_api", "subprocess",
]
# The existing Session/Documents seams own transport and saved-file effects.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Filesystem transactions have no semantic or protocol dependencies"
type = "forbidden"
source_modules = ["gz_mcp_lsp.filesystem", "gz_mcp_lsp._posix_files"]
forbidden_modules = [
    "gz_mcp_lsp.navigation", "gz_mcp_lsp.diagnostics", "gz_mcp_lsp.mutations",
    "gz_mcp_lsp.documents", "gz_mcp_lsp.session", "gz_mcp_lsp.lsp_transport",
    "gz_mcp_lsp.mcp_api", "mcp", "subprocess",
]

[[tool.importlinter.contracts]]
name = "Edit planning cannot reach transaction or protocol effects"
type = "forbidden"
source_modules = ["gz_mcp_lsp.edit_plan"]
forbidden_modules = [
    "gz_mcp_lsp.filesystem", "gz_mcp_lsp._posix_files", "gz_mcp_lsp.mutations",
    "gz_mcp_lsp.documents", "gz_mcp_lsp.session", "gz_mcp_lsp.lsp_transport",
    "gz_mcp_lsp.mcp_api", "mcp", "subprocess",
]

[tool.deptry]
known_first_party = ["gz_mcp_lsp"]
extend_exclude = ["tools/.*"]
